<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>北海道ギフト診断</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/gift.css}">
</head>

<body>

	<header th:replace="layout/_header :: header"></header>

	<main class="container">

		<div class="title-box">
			<h1>北海道ギフトページ</h1>
		</div>
		<hr>
		<div class="question-number">人気ギフト商品TOP3</div>
		<section class="question-area">

			<a class="question-card" th:each="product, stat : ${topGiftProducts}"
				th:href="@{/products/{id}(id=${product.id})}">
				<!-- topGiftProducts を1件ずつ取り出し、商品詳細ページへのリンクを設定 -->
				<div class="question-number" th:text="'TOP' + ${stat.count}">
					TOP1
				</div>

				<img th:src="@{${product.image}}">
				<!-- 商品画像を表示 -->
				<h3 th:text="${product.name}"></h3>
				<!-- 商品名を表示 -->
				<p th:text="'¥' + ${product.price}"></p>
				<!-- 商品価格を表示 -->
			</a>

		</section>


		<section class="result-area">

			<div class="result-label">
				その他のギフトとして選ばれている商品
			</div>

			<div class="gift-slider">

				<button type="button" class="slider-btn prev-btn">＜</button>

				<div class="product-list">

					<a class="product-card" th:each="product : ${otherGiftProducts}"
						th:href="@{/products/{id}(id=${product.id})}">
						<img th:src="@{${product.image}}">
						<h3 th:text="${product.name}"></h3>
						<p th:text="'¥' + ${product.price}"></p>
					</a>

				</div>

				<button type="button" class="slider-btn next-btn">＞</button>

			</div>

		</section>

	</main>

	<header th:replace="layout/_footer :: footer"></header>

	<script>
		const cards = document.querySelectorAll('.product-list .product-card');
		const prevBtn = document.querySelector('.prev-btn');
		const nextBtn = document.querySelector('.next-btn');

		let startIndex = 0;
		let displayCount = 4;

		function updateDisplayCount() {
			displayCount = window.innerWidth <= 600 ? 1 : 4;
		}

		function showCards() {
			updateDisplayCount();

			cards.forEach(card => {
				card.classList.remove('show');
			});

			for (let i = startIndex; i < startIndex + displayCount && i < cards.length; i++) {
				cards[i].classList.add('show');
			}
		}

		nextBtn.addEventListener('click', () => {
			updateDisplayCount();

			if (startIndex + displayCount < cards.length) {
				startIndex += displayCount;
			} else {
				startIndex = 0;
			}

			showCards();
		});

		prevBtn.addEventListener('click', () => {
			updateDisplayCount();

			if (startIndex - displayCount >= 0) {
				startIndex -= displayCount;
			} else {
				startIndex = Math.max(cards.length - displayCount, 0);
			}

			showCards();
		});

		window.addEventListener('resize', () => {
			startIndex = 0;
			showCards();
		});

		showCards();
	</script>
</body>

</html>
