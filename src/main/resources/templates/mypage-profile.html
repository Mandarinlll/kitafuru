<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ECサイト 北ふる | 登録情報変更</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/mypage-profile.css}">
</head>

<body>

	<div th:replace="~{layout/_header :: header}"></div>
	<div th:replace="~{layout/_sidebar :: sidebar}"></div>

	<main class="main mypage-profile-page">
		<div class="mypage-layout">

			<div th:replace="~{layout/_menu :: menu('profile')}"></div>

			<section class="profile-content">

				<section class="profile-box">
					<h2>基本情報</h2>

					<div class="info-grid">

						<div class="info-item">
							<label>お名前</label>
							<div class="info-row">
								<input type="text" th:value="${user.name}" readonly>
								<a href="#">変更する</a>
							</div>
						</div>

						<div class="info-item">
							<label>メールアドレス</label>
							<div class="info-row">
								<input type="email" th:value="${user.email}" readonly>
								<a href="#">変更する</a>
							</div>
						</div>

						<div class="info-item">
							<label>パスワード</label>
							<div class="info-row">
								<input type="password" value="********" readonly>
								<a href="#">変更する</a>
							</div>
						</div>

					</div>
				</section>

				<section class="profile-box">
					<div class="box-header">
						<h2>お届け先住所</h2>
						<a class="add-button" href="#">＋ 新規追加</a>
					</div>

					<div class="address-row">
						<span class="badge">既定</span>
						<p>〒060-0001 北海道札幌市中央区北1条西〇〇ノ 山田 太郎</p>

						<div class="row-actions">
							<a href="#">編集</a>
							<a href="#">削除</a>
						</div>
					</div>

					<div class="address-row">
						<span class="badge sub">選択</span>
						<p>〒150-0001 東京都渋谷区神宮前〇〇ノ 実家</p>

						<div class="row-actions">
							<a href="#">編集</a>
							<a href="#">削除</a>
						</div>
					</div>
				</section>

				<section class="profile-box">
					<div class="box-header">
						<h2>支払方法</h2>
						<a class="add-button" href="#">＋ 新規追加</a>
					</div>

					<div class="address-row">
						<span class="badge">既定</span>
						<p>💳 VISA **** **** 1234 ／ 有効期限 12/27 ／ 山田 太郎</p>

						<div class="row-actions">
							<a href="#">編集</a>
							<a href="#">削除</a>
						</div>
					</div>

					<div class="address-row">
						<span class="badge sub">選択</span>
						<p>🏪 コンビニ払い（セブン・ローソン・ファミマ）</p>

						<div class="row-actions">
							<a href="#">編集</a>
							<a href="#">削除</a>
						</div>
					</div>
				</section>

			</section>
		</div>
	</main>

	<div th:replace="~{layout/_footer :: footer}"></div>

</body>
</html>
