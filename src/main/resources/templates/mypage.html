<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ECサイト 北ふる | マイページ</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>
	<div th:replace="~{common/header :: header}"></div>

	<main class="mypage">
		<section class="mypage-hero">
			<p class="page-label">MY PAGE</p>
			<h1>こんにちは、山田 太郎 さん</h1>
		</section>

		<div class="mypage-layout">
			<aside class="mypage-menu">
				<h2>MENU</h2>

				<nav>
					<a class="active" href="#">注文履歴</a>
					<a href="#">お気に入り商品</a>
					<a href="#">最近見た商品</a>
					<a href="#">登録情報変更</a>
					<a href="#">お届け先管理</a>
					<a href="#">支払い情報</a>
					<a href="#">ログアウト</a>
				</nav>
			</aside>

			<section class="mypage-content">
				<section class="mypage-section">
					<h2>最近の注文</h2>

					<div class="order-list">
						<article class="order-card">
							<div class="order-img"></div>
							<div class="order-info">
								<h3>十勝産チーズセット はな1</h3>
								<p>注文日：2025/05/11　/　¥7,800　/　発送完了</p>
								<a href="#">→ 詳細　/　もう一度買う</a>
							</div>
						</article>

						<article class="order-card">
							<div class="order-img"></div>
							<div class="order-info">
								<h3>函館海メロン</h3>
								<p>注文日：2025/04/12　/　¥4,500　/　発送完了</p>
								<a href="#">→ 詳細　/　もう一度買う</a>
							</div>
						</article>
					</div>
				</section>

				<section class="mypage-section">
					<h2>お気に入り店舗</h2>

					<div class="shop-grid">
						<a href="#" class="shop-card">[店舗カード]</a>
						<a href="#" class="shop-card">[店舗カード]</a>
						<a href="#" class="shop-card">[店舗カード]</a>
						<a href="#" class="shop-card">[店舗カード]</a>
					</div>
				</section>

				<section class="recommend-section">
					<h2>AI　/　あなたへのおすすめ</h2>
					<p>最近のご注文と閲覧傾向から</p>

					<div class="recommend-grid">
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
					</div>
				</section>
			</section>
		</div>
	</main>

	<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
