<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ECサイト 北ふる | マイページ</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/mypage-order.css}">
</head>

<body>

	<div th:replace="~{layout/_header :: header}"></div>
	<div th:replace="~{layout/_sidebar :: sidebar}"></div>

	<main class="mypage">

		<div class="mypage-layout">

			<div th:replace="~{layout/_menu :: menu('order')}"></div>

			<section class="mypage-content">

				<section class="mypage-hero">
					<p class="page-label">MY PAGE</p>

					<h1>
						こんにちは、
						<span th:text="${user.name}">山田 太郎</span>
						さん
					</h1>
				</section>

				<section class="mypage-section">

					<h2>
						最近の注文
						<span class="order-count"
						      th:text="${recentOrders.size()} + '件'">
							0件
						</span>
					</h2>

					<div class="order-list">

						<article class="order-card"
								 th:each="order : ${recentOrders}">

							<img class="order-img"
								 th:src="@{${order.productImage}}"
								 alt="商品画像">

							<div class="order-info">

								<h3 th:text="${order.productName}">
									商品名
								</h3>

								<p>
									注文日：
									<span th:text="${#dates.format(order.orderAt, 'yyyy/MM/dd')}">
										2026/05/20
									</span>
								</p>

								<a th:href="@{/products/{id}(id=${order.productId})}">
									→ 詳細
								</a>

							</div>

						</article>

						<p class="empty-message"
						   th:if="${recentOrders.isEmpty()}">
							注文履歴はまだありません
						</p>

					</div>

				</section>

			</section>

		</div>

	</main>

	<div th:replace="~{layout/_footer :: footer}"></div>

</body>
</html>
