<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ECサイト 北ふる | マイページ</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/mypage-order.css}">
</head>

<body>
	<div th:replace="~{layout/_header :: header}"></div>
	<div th:replace="~{layout/_sidebar :: sidebar}"></div>

	<main class="mypage">
		<section class="mypage-hero">
			<p class="page-label">MY PAGE</p>
			<h1>
				こんにちは、<span th:text="${user.name}">山田 太郎</span> さん
			</h1>
		</section>

		<div class="mypage-layout">
			<div th:replace="~{layout/_menu :: menu('order')}"></div>

			<section class="mypage-content">
				<section class="mypage-section">
					<h2>最近の注文</h2>

					<div class="order-list">
						<article class="order-card" th:each="order : ${recentOrders}">
							<img class="order-img"
								 th:src="@{${order.productImage}}"
								 alt="商品画像">

							<div class="order-info">
								<h3 th:text="${order.productName}">商品名</h3>

								<p>
									注文日：
									<span th:text="${#dates.format(order.orderAt, 'yyyy/MM/dd')}">
									　/　
									<span th:text="${'¥' + #numbers.formatInteger(order.totalPrice, 0, 'COMMA')}">¥7,800</span>
									　/　発送完了
								</p>

								<a th:href="@{/products/{id}(id=${order.productId})}">
									→ 詳細
									</a>	
							</div>
						</article>
					</div>
				</section>

				<section class="recommend-section">
					<h2>AI　/　あなたへのおすすめ</h2>
					<p>最近のご注文と閲覧傾向から</p>

					<div class="recommend-grid">
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
						<a href="#" class="recommend-card"></a>
					</div>
				</section>
			</section>
		</div>
	</main>

	<div th:replace="~{layout/_footer :: footer}"></div>
</body>
</html>
