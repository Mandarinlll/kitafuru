<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>商品一覧</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 商品一覧専用CSS -->
	<link rel="stylesheet" th:href="@{/css/products.css}">
</head>

<body>

	<!-- 共通ヘッダー -->
	<div th:replace="~{layout/_header :: header}"></div>

	<main class="products-page">

		<section class="products-container">

			<!-- 上部バー -->
			<div class="products-topbar">
				<span>LOGO</span>
				<span>Header navigation</span>
			</div>

			<!-- パンくず -->
			<p class="breadcrumb">
				ホーム \ 商品を探す
			</p>

			<!-- タイトル -->
			<div class="result-header">

				<div>
					<h1>
						検索結果：
						<span>「北海道チーズ」</span>
					</h1>

					<p class="result-count">
						全48件中 1-12件を表示
					</p>
				</div>

				<!-- 並び替え -->
				<div class="sort-box">

					<label for="sort">並び替え：</label>

					<select id="sort">
						<option>おすすめ順 ▼</option>
						<option>人気順</option>
						<option>新着順</option>
						<option>価格が安い順</option>
						<option>価格が高い順</option>
					</select>

				</div>

			</div>

			<!-- メイン -->
			<div class="products-layout">

				<!-- サイドバー -->
				<aside class="filter-sidebar">

					<h2>絞り込み</h2>

					<div class="filter-group">
						<p class="filter-title">カテゴリ</p>

						<label><input type="checkbox"> 乳製品</label>
						<label><input type="checkbox"> スイーツ</label>
						<label><input type="checkbox"> 日配品</label>
					</div>

					<div class="filter-group">
						<p class="filter-title">地域</p>

						<label><input type="checkbox"> 十勝</label>
						<label><input type="checkbox"> 富良野</label>
						<label><input type="checkbox"> 函館</label>
					</div>

					<div class="filter-group">
						<p class="filter-title">用途</p>

						<label><input type="checkbox"> 自宅用</label>
						<label><input type="checkbox"> ギフト</label>
					</div>

					<div class="filter-group">
						<p class="filter-title">価格帯</p>

						<label><input type="radio" name="price"> ～3,000円</label>
						<label><input type="radio" name="price"> 3,000〜5,000円</label>
						<label><input type="radio" name="price"> 5,000円以上</label>
					</div>

					<button class="filter-button">
						絞り込む
					</button>

				</aside>

				<!-- 商品一覧 -->
				<section class="products-grid">

					<!-- 商品カード -->
					<article class="product-card active">

						<div class="product-image">
							[商品画像]
						</div>

						<div class="product-body">

							<p class="product-name">
								十勝チーズセット
							</p>

							<p class="product-description">
								濃厚な味わい・100%北海道産
							</p>

							<p class="product-price">
								¥3,980
							</p>

							<div class="product-footer">
								<a href="#">+ 詳細を見る</a>

								<button>♡</button>
							</div>

						</div>
					</article>

					<!-- ダミーカード -->
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>
					<article class="product-card empty">[商品カード]</article>

				</section>

			</div>

		</section>

	</main>

	<!-- 共通フッター -->
	<div th:replace="~{layout/_footer :: footer}"></div>

</body>

</html>
