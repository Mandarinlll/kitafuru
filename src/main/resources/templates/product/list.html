<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>商品一覧</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 商品一覧専用CSS -->
	<link rel="stylesheet" th:href="@{/css/products.css}">
</head>

<body>

	<!-- 共通ヘッダー -->
	<div th:replace="~{layout/_header :: header}"></div>

	<main class="products-page">

		<section class="products-container">

			<!-- パンくず -->
			<p class="breadcrumb">
				ホーム \ 商品を探す
			</p>

			<!-- タイトル -->
			<div class="result-header">

				<div>
					<h1>
						商品一覧
					</h1>

					<!-- 商品件数表示 -->
					<p class="result-count">
						全<span th:text="${#lists.size(productList)}"></span>件
					</p>
				</div>

				<!-- 並び替え -->
				<div class="sort-box">

					<label for="sort">並び替え：</label>

					<select id="sort">
						<option>おすすめ順 ▼</option>
						<option>人気順</option>
						<option>新着順</option>
						<option>価格が安い順</option>
						<option>価格が高い順</option>
					</select>

				</div>

			</div>

			<!-- メイン -->
			<div class="products-layout">

				<!-- サイドバー -->
				<aside class="filter-sidebar">

					<h2>絞り込み</h2>

					<div class="filter-group">
						<p class="filter-title">カテゴリ</p>

						<label><input type="checkbox"> 乳製品</label>
						<label><input type="checkbox"> スイーツ</label>
						<label><input type="checkbox"> 海産物</label>
					</div>

					<div class="filter-group">
						<p class="filter-title">地域</p>

						<label><input type="checkbox"> 十勝</label>
						<label><input type="checkbox"> 富良野</label>
						<label><input type="checkbox"> 函館</label>
					</div>

					<button class="filter-button">
						絞り込む
					</button>

				</aside>

				<!-- 商品一覧 -->
				<section class="products-grid">

					<!-- 商品を繰り返し表示 -->
					<article class="product-card"
						th:each="product : ${productList}">

						<!-- 商品画像 -->
						<div class="product-image">

							<img th:src="${product.image}"
								th:alt="${product.name}">

						</div>

						<div class="product-body">

							<!-- 商品名 -->
							<p class="product-name"
								th:text="${product.name}">
							</p>

							<!-- 商品説明 -->
							<p class="product-description"
								th:text="${product.body}">
							</p>

							<!-- 商品価格 -->
							<p class="product-price">
								¥<span th:text="${product.price}"></span>
							</p>

							<div class="product-footer">

								<!-- 商品詳細 -->
								<a href="#">
									+ 詳細を見る
								</a>

								<!-- お気に入り -->
								<button>
									♡
								</button>

							</div>

						</div>

					</article>

				</section>

			</div>

		</section>

	</main>

	<!-- 共通フッター -->
	<div th:replace="~{layout/_footer :: footer}"></div>

</body>

</html>
