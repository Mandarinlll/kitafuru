<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title th:text="${product.name}">商品詳細</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/product-detail.css}">
</head>

<body>

<div th:replace="~{layout/_header :: header}"></div>

<main class="detail-page">

	<section class="detail-container">

		<div class="detail-layout">

			<section class="product-detail">

				<!-- 商品画像 -->
				<div class="product-image">

					<img
						th:src="@{${product.image}}"
						th:alt="${product.name}">

				</div>

				<!-- 商品情報 -->
				<div class="product-info">

					<h1 th:text="${product.name}"></h1>

					<p class="product-meta">
						産地：
						<span th:text="${product.originArea}"></span>
					</p>

					<p class="product-price">

						<span class="price-main">
							¥<span th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}"></span>
						</span>

						<span class="price-sub">
							（税込・送料別）
						</span>

					</p>

					<!-- カート追加フォーム -->
					<form th:action="@{/cart/add}" method="post">

						<input
							type="hidden"
							name="productId"
							th:value="${product.id}">

						<div class="quantity-box">

							<span>数量</span>

							<div class="quantity-control">

								<!-- マイナス -->
								<button
									type="submit"
									formaction="/products/decrease"
									class="quantity-btn">

									−

								</button>

								<!-- 数量 -->
								<input
									type="text"
									name="quantity"
									th:value="${quantity != null ? quantity : 1}"
									readonly
									class="quantity-input">

								<!-- プラス -->
								<button
									type="submit"
									formaction="/products/increase"
									class="quantity-btn">

									＋

								</button>

							</div>

						</div>

						<!-- カート追加 -->
						<button
							type="submit"
							class="cart-button">

							🛒 カートに入れる

						</button>

					</form>

				</div>

			</section>

		</div>

	</section>

</main>

<div th:replace="~{layout/_footer :: footer}"></div>

</body>
</html>
