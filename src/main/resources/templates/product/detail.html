<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>商品詳細</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">

  <!-- 商品詳細専用CSS -->
  <link rel="stylesheet" th:href="@{/css/product-detail.css}">
</head>

<body>

  <!-- 共通ヘッダー -->
  <div th:replace="~{layout/_header :: header}"></div>

  <main class="detail-page">

    <section class="detail-container">

      <!-- 上部バー -->
      <div class="detail-topbar">
        <span>LOGO</span>
        <span>Header navigation</span>
      </div>

      <!-- パンくず -->
      <p class="breadcrumb">
        ホーム \ 乳製品 \ 十勝チーズセット
      </p>

      <!-- 商品詳細 -->
      <div class="detail-layout">

        <!-- 左側 -->
        <section class="product-detail">

          <!-- 商品画像 -->
          <div class="product-image">
            [メイン画像]
          </div>

          <!-- 商品情報 -->
          <div class="product-info">

            <h1>十勝産チーズセット</h1>

            <p class="product-meta">
              産地：北海道十勝 ／ 店舗：十勝○○工房
            </p>

            <p class="product-price">
              ¥4,500
              <span>（税込・送料別）</span>
            </p>

            <!-- 数量 -->
            <div class="quantity-box">

              <span>数量</span>

              <div class="quantity-control">
                <button>-</button>
                <span>1</span>
                <button>+</button>
              </div>

            </div>

            <!-- ボタン -->
            <button class="cart-button">
              🛒 カートに入れる
            </button>

            <button class="favorite-button">
              ♡ このお店をお気に入り
            </button>

            <!-- 商品説明 -->
            <div class="description">

              <h2>商品説明</h2>

              <p>
                北海道十勝産の牛乳を使用したチーズセット。
                濃厚な味わいで、ワインやパンとの相性も抜群。
              </p>

            </div>

          </div>

        </section>

        <!-- 右側 -->
        <aside class="shop-card">

          <h2>この商品を作っている人</h2>

          <div class="shop-header">

            <div class="shop-icon"></div>

            <div>

              <h3>十勝〇〇工房</h3>

              <p>
                地元の牛乳を使い、
                素材の味を活かした製法にこだわっています。
              </p>

            </div>

          </div>

          <a href="#" class="story-link">
            → 生産者ストーリーを見る
          </a>

        </aside>

      </div>

      <!-- 関連商品 -->
      <section class="related-products">

        <h2>関連商品</h2>

        <div class="related-grid">

          <div class="related-item"></div>
          <div class="related-item"></div>
          <div class="related-item"></div>
          <div class="related-item"></div>
          <div class="related-item"></div>

        </div>

      </section>

    </section>

  </main>

  <!-- 共通フッター -->
  <div th:replace="~{layout/_footer :: footer}"></div>

</body>
</html>
