<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>注文完了</title>

    <!-- 共通CSS -->
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

    <!-- 注文完了ページ専用 -->
    <link rel="stylesheet"
          th:href="@{/css/order-complete.css}">
</head>

<body>

<div class="complete-container">

    <!-- 進捗バー -->
    <div class="step-bar">
        <span>①カート</span>
        <span>ー</span>
        <span>②注文確認</span>
        <span>ー</span>
        <span class="active">③注文完了</span>
    </div>

    <!-- チェックアイコン -->
    <div class="check-circle">
        ✓
    </div>

    <!-- 完了メッセージ -->
    <h1>ご注文ありがとうございました</h1>

    <p class="complete-text">
        ご注文完了メールをお送りしました。<br>
        商品の発送準備が整い次第、改めて発送通知メールでお知らせいたします。
    </p>

    <!-- 下段カード -->
    <div class="info-area">

        <!-- 注文情報 -->
        <div class="order-box">

            <small>ORDER NUMBER / 注文番号</small>

            <!-- 注文番号 -->
            <h2 th:text="'#' + ${orderNumber}">
                #HKD-20260520-1234
            </h2>

            <hr>

            <!-- お届け予定日 -->
            <div class="order-detail">

                <span>お届け予定日</span>

                <span th:text="${#temporals.format(deliveryDate,'yyyy年M月d日(E)')}">
                    2026年5月23日(土)
                </span>

            </div>

            <!-- 支払金額 -->
            <div class="order-detail">

                <span>お支払い金額</span>

                <span>

                    <span th:text="'¥' + ${#numbers.formatInteger(totalPrice,0,'COMMA')}">
                        ¥7,800
                    </span>

                    （<span th:text="${paymentMethod}">
                        クレジットカード
                    </span>）

                </span>

            </div>

        </div>

        <!-- 配送先＋ボタン -->
        <div>

            <div class="address-box">

                <small>SHIP TO / お届け先</small>

                <p>

                    <span th:text="${user.name}">
                        山田太郎
                    </span>
                    様

                    <br>

                    <span th:text="${user.address}">
                        〒060-0001 北海道札幌市中央区○○
                    </span>

                </p>

            </div>

            <form th:action="@{/mypage-order}"
                  method="get"
                  class="mypage-btn-form">

                <button type="submit"
                        class="checkout-btn">

                    注文詳細を見る（マイページ）

                </button>

            </form>

            <div class="bottom-buttons">

                <a th:href="@{/products}"
                   class="sub-btn">

                    ショッピングを続ける

                </a>

                <a th:href="@{/home}"
                   class="sub-btn">

                    トップページへ戻る

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
