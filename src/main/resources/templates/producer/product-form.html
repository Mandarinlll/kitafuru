<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${pageTitle}">商品登録</title>
<link rel="stylesheet" th:href="@{/css/producer.css}">
</head>
<body>
	<header class="producer-header">
		<a class="logo-box" th:href="@{/home}">LOGO</a>
		<label class="site-search">
			<span class="search-mark">検索</span>
			<input type="search" placeholder="商品名・産地・生産者を検索">
		</label>
		<div class="header-actions">
			<a class="header-action" th:href="@{/favorite-products}">♡</a>
			<a class="header-action" th:href="@{/cart}">カート</a>
			<a class="header-login" th:href="@{/user-login}">ログイン / マイページ</a>
		</div>
	</header>

	<div class="producer-shell">
		<aside class="producer-sidebar">
			<div class="producer-card">
				<p class="sidebar-label">PRODUCER DB</p>
				<p class="producer-name">十勝○○工房</p>
				<p class="producer-id">生産者ID：PR-00821</p>
			</div>
			<nav class="side-nav" aria-label="生産者メニュー">
				<a class="side-nav-item" th:href="@{/producer-dashboard}"><span>▥</span>ダッシュボード</a>
				<a class="side-nav-item active" th:href="@{/producer/products}"><span>□</span>商品管理</a>
				<a class="side-nav-item" th:href="@{/producer/orders}"><span>▤</span>注文管理</a>
				<a class="side-nav-item" href="#"><span>●</span>ユーザー管理</a>
				<a class="side-nav-item side-nav-sub-item" th:href="@{/producer-page}">店舗詳細</a>
			</nav>
			<a class="logout-link" th:href="@{/user-logout}">→ ログアウト</a>
		</aside>

		<main class="producer-main">
			<div class="page-title-row">
				<h1 th:text="${pageTitle}">商品登録</h1>
				<time th:text="${#temporals.format(businessDate, 'yyyy/MM/dd')}">2025/05/12</time>
			</div>

			<form class="admin-panel profile-form" th:object="${productForm}" method="post"
				th:action="@{/producer/products/save}">
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{producerId}">

				<section class="form-section">
					<div class="section-title-row">
						<div>
							<h2>商品情報</h2>
							<p>入力した内容はproductsテーブルへ保存されます。</p>
						</div>
					</div>

					<div class="form-grid">
						<label class="form-wide">
							<span>商品名</span>
							<input type="text" th:field="*{name}" required>
						</label>
						<label>
							<span>価格</span>
							<input type="number" th:field="*{price}" min="0" required>
						</label>
						<label>
							<span>在庫数</span>
							<input type="number" th:field="*{stock}" min="0" required>
						</label>
						<label>
							<span>カテゴリ</span>
							<select th:field="*{categoryId}" required>
								<option th:each="category : ${categories}" th:value="${category.id}"
									th:text="${category.name}">乳製品</option>
							</select>
						</label>
						<label>
							<span>地域 / 産地</span>
							<input type="text" th:field="*{originArea}" required>
						</label>
						<label class="form-wide">
							<span>商品画像URL</span>
							<input type="text" th:field="*{image}" placeholder="/images/products/sample.jpg">
						</label>
						<label class="form-wide">
							<span>商品説明</span>
							<textarea th:field="*{body}" rows="6"></textarea>
						</label>
					</div>
				</section>

				<div class="form-actions">
					<button class="primary-button" type="submit" th:text="${productForm.id == 0 ? '登録する' : '更新する'}">登録する</button>
					<a class="secondary-button" th:href="@{/producer/products}">一覧へ戻る</a>
				</div>
			</form>
		</main>
	</div>

	<footer class="producer-footer">
		<nav aria-label="フッターメニュー">
			<a href="#">ご利用ガイド</a>
			<a href="#">配送・送料</a>
			<a href="#">よくある質問</a>
			<a href="#">お問い合わせ</a>
			<a href="#">生産者の方へ</a>
			<a href="#">会社情報</a>
			<a href="#">利用規約</a>
			<a href="#">プライバシーポリシー</a>
		</nav>
		<span>© Kita no Furusato EC</span>
	</footer>
</body>
</html>
