<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${pageTitle}">商品登録</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/producer/product-form.css}">
</head>

<body>
	<div class="producer-shell">
		<div th:replace="~{layout/_psidebar :: psidebar}"></div>

		<main class="producer-main">
			<div class="page-title-row">
				<h1 th:text="${pageTitle}">商品登録</h1>
				<time th:text="${#temporals.format(businessDate, 'yyyy/MM/dd')}">2025/05/12</time>
			</div>

			<form class="admin-panel profile-form" th:object="${productForm}" method="post"
				th:action="@{/producer/products/save}"
				enctype="multipart/form-data">
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{producerId}">

				<section class="form-section">
					<div class="section-title-row">
						<div>
							<h2>商品情報</h2>
							<p>入力した内容はproductsテーブルへ保存されます。</p>
						</div>
					</div>

					<div class="form-grid">
						<label class="form-wide">
							<span>商品名</span>
							<input type="text" th:field="*{name}" required>
						</label>
						<label>
							<span>価格</span>
							<input type="number" th:field="*{price}" min="0" required>
						</label>
						<label>
							<span>在庫数</span>
							<input type="number" th:field="*{stock}" min="0" required>
						</label>
						<label>
							<span>カテゴリ</span>
							<select th:field="*{categoryId}" required>
								<option th:each="category : ${categories}" th:value="${category.id}"
									th:text="${category.name}">乳製品</option>
							</select>
						</label>
						<label>
							<span>地域 / 産地</span>
							<input type="text" th:field="*{originArea}" required>
						</label>
						<label class="form-wide">
							<span>商品画像URL</span>
							<input type="file" name="imageFile">
						</label>
						<label class="form-wide">
							<span>商品説明</span>
							<textarea th:field="*{body}" rows="6"></textarea>
						</label>
					</div>
				</section>

				<div class="form-actions">
					<button class="primary-button" type="submit"
						th:text="${productForm.id == 0 ? '登録する' : '更新する'}">登録する</button>
					<a class="secondary-button" th:href="@{/producer/products}">一覧へ戻る</a>
				</div>
			</form>
		</main>
	</div>

	<footer th:replace="layout/_footer :: footer"></footer>

</body>

</html>
