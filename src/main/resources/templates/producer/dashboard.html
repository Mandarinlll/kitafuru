<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>生産者ダッシュボード</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/producer.css}">
</head>

<body>
	<div th:replace="~{layout/_psidebar :: psidebar}"></div>
	<div class="producer-shell">
		

		<main class="producer-main">
			<div class="page-title-row">
				<h1>ダッシュボード</h1>
				<time th:text="${#temporals.format(businessDate, 'yyyy/MM/dd')}">2025/05/12</time>
			</div>

			<section class="metric-grid" aria-label="売上サマリー">
				<div class="metric-card accent-green">
					<p class="metric-label">本日の注文数</p>
					<p class="metric-value"><span th:text="${summary.todayOrderCount}">12</span><small>件</small></p>
					<p class="metric-change positive"
						th:text="${summary.orderCountDiff >= 0 ? '▲ 前日比 +' + summary.orderCountDiff + '件' : '▼ 前日比 ' + summary.orderCountDiff + '件'}">
						▲ 前日比 +3件</p>
				</div>
				<div class="metric-card accent-red">
					<p class="metric-label">本日の売上</p>
					<p class="metric-value" th:text="|¥${#numbers.formatInteger(summary.todaySales, 0, 'COMMA')}|">
						¥85,000</p>
					<p class="metric-change positive"
						th:text="${summary.salesGrowthRate >= 0 ? '▲ 前日比 +' + summary.salesGrowthRate + '%' : '▼ 前日比 ' + summary.salesGrowthRate + '%'}">
						▲ 前日比 +12%</p>
				</div>
				<div class="metric-card accent-blue">
					<p class="metric-label">今月の売上</p>
					<p class="metric-value" th:text="|¥${#numbers.formatInteger(summary.monthlySales, 0, 'COMMA')}|">
						¥1,000,000</p>
					<p class="metric-change muted">月初から本日まで</p>
				</div>
			</section>

			<section class="admin-panel report-panel">
				<div class="section-title-row">
					<div>
						<h2>売上・注文レポート</h2>
						<p>日別の売上金額、注文数、販売点数を確認できます。</p>
					</div>
				</div>
				<div class="table-wrap">
					<table class="admin-table">
						<thead>
							<tr>
								<th>日付</th>
								<th>注文数</th>
								<th>販売点数</th>
								<th>売上金額</th>
								<th>平均注文単価</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="report : ${salesReports}">
								<td th:text="${#temporals.format(report.reportDate, 'yyyy/MM/dd')}">2025/05/12</td>
								<td th:text="${report.orderCount + '件'}">12件</td>
								<td th:text="${report.totalQuantity + '点'}">18点</td>
								<td class="amount"
									th:text="|¥${#numbers.formatInteger(report.salesAmount, 0, 'COMMA')}|">¥85,000</td>
								<td th:text="|¥${#numbers.formatInteger(report.averageOrderAmount, 0, 'COMMA')}|">¥7,083
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</main>
	</div>
	<footer th:replace="layout/_footer :: footer"></footer>
</body>

</html>
