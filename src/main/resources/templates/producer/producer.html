<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title th:text="${producer.name} + '｜生産者詳細'">生産者詳細</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 生産者CSS -->
	<link rel="stylesheet" th:href="@{/css/producer-page.css}">
</head>

<body>

	<!-- ヘッダー -->
	<div th:replace="~{layout/_header :: header}"></div>

	<!-- サイドバー -->
	<div th:replace="~{layout/_sidebar :: sidebar}"></div>

	<main class="producer-main producer-story-main">

		<!-- メインビジュアル -->
		<section class="story-hero">

			<p class="story-label">
				PRODUCER STORY ／
				<span th:text="${producer.area}">北海道</span>
			</p>

			<h1 th:text="${producer.name}">
				十勝○○工房
			</h1>

			<p class="story-lead" th:text="${producer.body}">
				北海道十勝で、地元牛乳を使った乳製品を製造。
			</p>

			<p class="story-lead">
				素材の力を信じて、添加物に頼らない、ありのままの味づくり。
			</p>

		</section>

		<!-- ストーリー -->
		<section class="story-section">

			<h2>ストーリー</h2>

			<div class="story-layout">

				<div class="story-copy">

					<h3>なぜこの商品を作っているのか</h3>

					<p th:text="${producer.body}">
						素材を最大限に活かすため、仕入れから加工まで丁寧に向き合っています。
					</p>

					<h3>どんな地域で作られているのか</h3>

					<p>
						<span th:text="${producer.area}">北海道</span>
						の自然と気候が、商品の個性と旨味を育てています。
					</p>

					<h3>お店からのメッセージ</h3>

					<p th:text="${producer.body}">
						地域の味を大切にしながら、毎日の食卓に届く商品を作っています。
					</p>

				</div>

				<!-- 生産者画像 -->
				<div class="producer-face">

					<img th:if="${producer.image != null and !#strings.isEmpty(producer.image)}"
						th:src="${producer.image}"
						th:alt="${producer.name}">

				</div>

			</div>

		</section>

		<!-- 取扱商品 -->
		<section class="story-section">

			<h2>取扱商品</h2>

			<div class="story-products">

				<!-- 商品一覧 -->
				<a class="story-product-card"
					th:each="product : ${products}"
					th:href="@{/products/{id}(id=${product.id})}">

					<div class="story-product-image">

						<img th:if="${product.image != null and !#strings.isEmpty(product.image)}"
							th:src="${product.image}"
							th:alt="${product.name}">

					</div>

					<p class="story-product-name"
						th:text="${product.name}">
						商品名
					</p>

					<p class="story-product-price">
						¥
						<span th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}">
							1,580
						</span>
					</p>

				</a>

				<!-- 商品が無い場合 -->
				<div class="story-product-card story-product-empty"
					th:if="${products == null or #lists.isEmpty(products)}">

					取扱商品は準備中です

				</div>

			</div>

		</section>

	</main>

	<!-- フッター -->
	<div th:replace="~{layout/_footer :: footer}"></div>

</body>

</html>
