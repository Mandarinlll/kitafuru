<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>検索結果</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 検索結果ページ専用CSS -->
	<link rel="stylesheet" th:href="@{/css/search-result.css}">
</head>

<body>

	<div th:replace="~{layout/_header :: header}"></div>

	<main class="search-result-page">

		<section class="search-header">

			<h1>検索結果</h1>

			<p class="result-count">
				<span th:text="${count}">0</span>件の商品が見つかりました
			</p>

		</section>

		<section class="products-grid">

			<div
				th:if="${count == 0}"
				class="no-result">

				商品が見つかりませんでした

			</div>

			<a
				th:each="product : ${productList}"
				th:href="@{/products/{id}(id=${product.id})}"
				class="product-link">

				<article class="product-card active">

					<div class="product-image">

						<img
							th:src="@{/images/{img}(img=${product.image})}"
							alt="商品画像">

					</div>

					<div class="product-body">

						<p
							class="product-name"
							th:text="${product.name}">
						</p>

						<p
							class="product-description"
							th:text="${product.body}">
						</p>

						<p
							class="product-price"
							th:text="'¥' + ${#numbers.formatInteger(product.price, 3, 'COMMA')}">
						</p>

						<div class="product-footer">

							<span>
								+ 詳細を見る
							</span>

							<button type="button">
								♡
							</button>

						</div>

					</div>

				</article>

			</a>

		</section>

	</main>

	<div th:replace="~{layout/_footer :: footer}"></div>

</body>

</html>
