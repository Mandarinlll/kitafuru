<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>検索結果</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 検索結果ページ専用CSS -->
	<link rel="stylesheet" th:href="@{/css/search-result.css}">
</head>

<body>

	<!-- 共通ヘッダー -->
	<div th:replace="~{layout/_header :: header}"></div>

	<main class="search-result-page">

		<!-- 検索ヘッダー -->
		<section class="search-header">

			<h1>

				検索結果

				<span
					th:if="${keyword != null and keyword != ''}"
					th:text="'：「' + ${keyword} + '」'">
				</span>

			</h1>

			<p class="result-count">

				<span th:text="${count}">
					0
				</span>

				件の商品が見つかりました

			</p>

		</section>

		<!-- 選択中条件 -->
		<section class="selected-section">

			<div class="selected-left">

				<span class="selected-label">
					選択中の条件：
				</span>

				<!-- キーワード -->
				<div
					th:if="${keyword != null and keyword != ''}"
					class="selected-tag"
					th:text="${keyword}">
				</div>

				<!-- カテゴリ -->
				<div
					th:if="${categories != null}"
					th:each="category : ${categories}"
					class="selected-tag">

					<span th:switch="${category}">

						<span th:case="'1'">
							海産物
						</span>

						<span th:case="'2'">
							乳製品
						</span>

						<span th:case="'3'">
							スイーツ
						</span>

						<span th:case="'4'">
							農作物
						</span>

						<span th:case="'5'">
							お酒
						</span>

						<span th:case="'6'">
							加工品
						</span>

						<span th:case="'7'">
							調味料
						</span>

						<span th:case="'8'">
							ギフト
						</span>

					</span>

				</div>

				<!-- 地域 -->
				<div
					th:if="${regions != null}"
					th:each="region : ${regions}"
					class="selected-tag"
					th:text="${region}">
				</div>

			</div>

		</section>

		<!-- 商品一覧 -->
		<section class="products-grid">

			<!-- 商品なし -->
			<div
				th:if="${count == 0}"
				class="no-result">

				商品が見つかりませんでした

			</div>

			<!-- 商品カード -->
			<a
				th:each="product : ${productList}"
				th:href="@{/products/{id}(id=${product.id})}"
				class="product-link">

				<article class="product-card active">

					<!-- 商品画像 -->
					<div class="product-image">

						<img
							th:src="@{/images/{img}(img=${product.image})}"
							alt="商品画像">

					</div>

					<!-- 商品情報 -->
					<div class="product-body">

						<p
							class="product-name"
							th:text="${product.name}">
						</p>

						<p
							class="product-description"
							th:text="${product.body}">
						</p>

						<p
							class="product-price"
							th:text="'¥' + ${#numbers.formatInteger(product.price, 3, 'COMMA')}">
						</p>

						<div class="product-footer">

							<span>
								+ 詳細を見る
							</span>

							<button type="button">
								♡
							</button>

						</div>

					</div>

				</article>

			</a>

		</section>

	</main>

	<!-- 共通フッター -->
	<div th:replace="~{layout/_footer :: footer}"></div>
	
	

</body>

</html>
