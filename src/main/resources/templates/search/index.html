<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>商品検索</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<!-- 検索ページ専用CSS -->
	<link rel="stylesheet" th:href="@{/css/search.css}">
</head>

<body>

	<!-- 共通ヘッダー -->
	<div th:replace="~{layout/_header :: header}"></div>
	<div th:replace="~{layout/_sidebar :: sidebar}"></div>

	<main class="search-page">

		<!-- パンくず -->
		<nav class="breadcrumb">
			<a th:href="@{/}">ホーム</a>
			<span>＞</span>
			<span>商品を探す・検索</span>
		</nav>

		<!-- タイトル -->
		<section class="search-header">

			<h1>商品を探す</h1>

			<p>
				キーワード、カテゴリー、地域から北海道の名産品を検索できます
			</p>

		</section>

		<!-- 検索フォーム -->
		<section class="search-box-section">

			<form
				th:action="@{/search/result}"
				method="get"
				class="search-form">

				<!-- キーワード -->
				<div class="search-input-area">

					<div class="search-input-wrapper">

						<span class="search-icon">
							🔍
						</span>

						<input
							type="text"
							name="keyword"
							placeholder="例：十勝チーズ / 富良野メロン / 鮭とば">

					</div>

					<button
						type="submit"
						class="search-button">

						検索する

					</button>

					<button
						type="reset"
						class="clear-button">

						クリア

					</button>

				</div>

				<!-- 検索条件 -->
				<section class="search-filter-section">

					<!-- カテゴリー -->
					<div class="category-area">

						<div class="section-title">
							CATEGORY ／ カテゴリーから探す
						</div>

						<div class="category-grid">

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="1">

								<div class="card-content">

									<div class="jp">
										海産物
									</div>

									<div class="en">
										SEAFOOD
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="2">

								<div class="card-content">

									<div class="jp">
										乳製品
									</div>

									<div class="en">
										DAIRY
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="3">

								<div class="card-content">

									<div class="jp">
										スイーツ
									</div>

									<div class="en">
										SWEETS
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="4">

								<div class="card-content">

									<div class="jp">
										農作物
									</div>

									<div class="en">
										CROPS
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="5">

								<div class="card-content">

									<div class="jp">
										お酒
									</div>

									<div class="en">
										SAKE
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="6">

								<div class="card-content">

									<div class="jp">
										加工品
									</div>

									<div class="en">
										PROCESSED
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="7">

								<div class="card-content">

									<div class="jp">
										調味料
									</div>

									<div class="en">
										SEASONING
									</div>

								</div>

							</label>

							<label class="category-card">

								<input
									type="checkbox"
									name="category"
									value="8">

								<div class="card-content">

									<div class="jp">
										ギフト
									</div>

									<div class="en">
										GIFT
									</div>

								</div>

							</label>

						</div>

					</div>

					<!-- 地域 -->
					<div class="region-area">

						<div class="section-title">
							REGION ／ 地域から探す
						</div>

						<div class="region-content">

							<div class="hokkaido-map">
								<img
									th:src="@{/images/hokkaido-map.png}"
									alt="北海道マップ"
									class="hokkaido-map-image">
							</div>

							<div class="region-buttons">

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="道央">

									道央

								</label>

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="道東">

									道東

								</label>

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="道南">

									道南

								</label>

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="十勝">

									十勝

								</label>

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="道北">

									道北

								</label>

								<label class="region-button">

									<input
										type="checkbox"
										name="region"
										value="オホーツク">

									オホーツク

								</label>

							</div>

						</div>

					</div>

				</section>

				<!-- 選択中条件 -->
				<section class="selected-section">

					<div class="selected-left">

						<span class="selected-label">
							選択中の条件：
						</span>

						<!-- カテゴリ -->
						<div
							th:if="${categories != null}"
							th:each="category : ${categories}"
							class="selected-tag"
							th:text="${category}">
						</div>

						<!-- 地域 -->
						<div
							th:if="${regions != null}"
							th:each="region : ${regions}"
							class="selected-tag"
							th:text="${region}">
						</div>

					</div>

					<div class="selected-right">

						<button
							type="submit"
							class="result-button">

							結果を見る →

						</button>

					</div>

				</section>

			</form>

		</section>

	</main>

	<!-- 共通フッター -->
	<footer th:replace="~{layout/_footer :: footer}"></footer>

	<script>

		document.addEventListener("DOMContentLoaded", () => {

			// 選択条件表示エリア
			const selectedLeft = document.querySelector(".selected-left");

			// 更新処理
			const updateSelectedTags = () => {

				// ラベルだけ残して初期化
				selectedLeft.innerHTML = `
					<span class="selected-label">
						選択中の条件：
					</span>
				`;

				// =========================
				// キーワード
				// =========================

				const keywordInput = document.querySelector(
					'input[name="keyword"]'
				);

				if (keywordInput.value.trim() !== "") {

					selectedLeft.innerHTML += `
						<div class="selected-tag">
							${keywordInput.value}
						</div>
					`;
				}

				// =========================
				// カテゴリ
				// =========================

				const checkedCategories = document.querySelectorAll(
					'input[name="category"]:checked'
				);

				checkedCategories.forEach(category => {

					const categoryName = category
						.closest(".category-card")
						.querySelector(".jp")
						.textContent;

					selectedLeft.innerHTML += `
						<div class="selected-tag">
							${categoryName}
						</div>
					`;
				});

				// =========================
				// 地域
				// =========================

				const checkedRegions = document.querySelectorAll(
					'input[name="region"]:checked'
				);

				checkedRegions.forEach(region => {

					const regionName = region
						.parentElement
						.textContent
						.trim();

					selectedLeft.innerHTML += `
						<div class="selected-tag">
							${regionName}
						</div>
					`;
				});

			};

			// =========================
			// イベント登録
			// =========================

			const allInputs = document.querySelectorAll(
				'input'
			);

			allInputs.forEach(input => {

				input.addEventListener(
					"change",
					updateSelectedTags
				);

				input.addEventListener(
					"keyup",
					updateSelectedTags
				);

			});
			
			// =========================
			// クリアボタン対応
			// =========================

			const form = document.querySelector(".search-form");

			form.addEventListener("reset", () => {

				// resetは即時反映されないので少し待つ
				setTimeout(() => {

					updateSelectedTags();

				}, 0);

			});

			// 初期表示
			updateSelectedTags();

		});

	</script>
</body>

</html>
