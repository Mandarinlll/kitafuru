<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>AI店員チャットボット</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/ai-chatbot.css}">

</head>

<body>
	<div th:replace="layout/_sidebar :: sidebar"></div>
	<div class="container">

		<div class="main">

			<div class="chat-wrapper">

				<div id="chat-box" class="chat-box"></div>

				<div id="loading" class="typing-indicator" style="display:none;">
					<span></span>
					<span></span>
					<span></span>
				</div>

				<div class="input-area">
					<input type="text" id="message" placeholder="メッセージを入力">

					<button type="button" class="send-button" onclick="sendMessage()">
						送信
					</button>
				</div>

			</div>

		</div>

	</div>

	<script>
		async function sendMessage() {

			const messageInput = document.getElementById("message");
			const message = messageInput.value;

			if (message.trim() === "") {
				return;
			}

			const chatBox = document.getElementById("chat-box");
			const loading = document.getElementById("loading");

			chatBox.innerHTML += `
				<div class="message user">
					${message}
				</div>
			`;

			messageInput.value = "";

			// ローディング表示
			loading.style.display = "flex";

			const response = await fetch("/api/ai/chat", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify({
					message: message
				})
			});

			const data = await response.json();

			// ローディング非表示
			loading.style.display = "none";

			const aiMessage = data.answerHtml
				.replace(/<br\s*\/?>/gi, "")
				.replace(/\n/g, "")
				.replace(/\t/g, "")
				.trim();

			const formattedMessage = aiMessage.replace(/\n/g, "<br>");

			const aiDiv = document.createElement("div");
			aiDiv.className = "message ai";

			chatBox.appendChild(aiDiv);

			let index = 0;

			const interval = setInterval(() => {

				aiDiv.innerHTML =
					formattedMessage.substring(0, index);

				index++;

				chatBox.scrollTop = chatBox.scrollHeight;

				if (index > formattedMessage.length) {
					clearInterval(interval);
				}

			}, 20);

			chatBox.scrollTop = chatBox.scrollHeight;
		}
	</script>

</body>

</html>
