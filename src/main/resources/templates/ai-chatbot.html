<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>AI店員チャットボット</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/ai-chatbot.css}">

</head>

<body>
	<div th:replace="layout/_sidebar :: sidebar"></div>
	<div class="container">

		<div class="main">

			<div class="chat-wrapper">

				<div id="chat-box" class="chat-box"></div>

				<div class="input-area">
					<input type="text" id="message" placeholder="メッセージを入力">

					<button type="button" class="send-button" onclick="sendMessage()">
						送信
					</button>
				</div>

			</div>

		</div>

	</div>

	<script>

		async function sendMessage() {

			const messageInput = document.getElementById("message");
			const message = messageInput.value;

			if (message.trim() === "") {
				return;
			}

			const chatBox = document.getElementById("chat-box");

			// ユーザー表示
			chatBox.innerHTML += `
				<div class="message user">
					${message}
				</div>
			`;

			messageInput.value = "";

			// API呼び出し
			const response = await fetch("/api/ai/chat", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify({
					message: message
				})
			});

			const data = await response.json();

			const aiMessage = data.answerHtml
				.replace(/<br\s*\/?>/gi, "")
				.replace(/\n/g, "")
				.replace(/\t/g, "")
				.trim();

			// 改行変換
			const formattedMessage = aiMessage.replace(/\n/g, "<br>");

			// AIメッセージ用div
			const aiDiv = document.createElement("div");
			aiDiv.className = "message ai";

			chatBox.appendChild(aiDiv);

			// 1文字ずつ表示
			let index = 0;

			const interval = setInterval(() => {

				aiDiv.innerHTML =
					formattedMessage.substring(0, index);

				index++;

				chatBox.scrollTop = chatBox.scrollHeight;

				if (index > formattedMessage.length) {
					clearInterval(interval);
				}

			}, 20);

			chatBox.scrollTop = chatBox.scrollHeight;
		}


	</script>

</body>

</html>
