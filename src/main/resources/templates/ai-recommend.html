<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>あなたへのおすすめ</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/ai-recommend.css}">
</head>

<body>
	<header th:replace="layout/_header :: header"></header>

	<main class="container">

		<div class="recommend-box">
			<div class="recommend-title">あなたへのおすすめ</div>
			<p>購入した商品からおすすめ商品を表示しています。</p>
		</div>

		<div class="message" th:if="${recommendedProducts != null and !recommendedProducts.isEmpty()}">
			ユーザが購入した商品と一緒に購入されることが多い商品
		</div>

		<div class="product-list" th:if="${recommendedProducts != null and !recommendedProducts.isEmpty()}">
			<a class="product-card" th:each="product : ${recommendedProducts}"
				th:href="@{/products/{id}(id=${product.id})}">

				<img class="product-image" th:src="@{${product.image}}" alt="商品画像">

				<div class="product-name" th:text="${product.name}">商品名</div>

				<div class="product-price">
					¥<span th:text="${product.price}">1000</span>
				</div>
			</a>
		</div>

		<div class="message" th:if="${recommendedProducts == null or recommendedProducts.isEmpty()}">
			おすすめ商品はまだありません。
		</div>

	</main>

	<footer th:replace="layout/_footer :: footer"></footer>
</body>

</html>
