<!-- UserRegisterController -->
<!-- register.html -->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ECサイト 北ふる | 新規登録</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

	<header class="login-header">
		<div class="header-inner">
			<a href="/" class="header-logo">LOGO</a>
			<span class="header-nav">Header navigation</span>
		</div>
	</header>

	<main class="register-page">

		<div class="step-bar">
			<span class="active">① 情報入力</span>
			<span>—</span>
			<span>② メール認証</span>
			<span>—</span>
			<span>③ 登録完了</span>
		</div>

		<section class="register-panel">

			<p class="register-subtitle">EMAIL SIGN UP</p>

			<h1 class="register-title">
				メールアドレスで登録
			</h1>

			<form class="register-form"
			      th:action="@{/register}"
			      th:object="${form}"
			      method="post">

				<div class="form-row">
					<div class="form-group">
						<label>お名前 <span>*</span></label>
						<input type="text"
						       th:field="*{name}"
						       placeholder="姓（例：山田）">

						<p class="field-error"
						   th:if="${#fields.hasErrors('name')}"
						   th:errors="*{name}">
						</p>
					</div>

					<div class="form-group">
						<label>&nbsp;</label>
						<input type="text"
						       placeholder="名（例：太郎）">
					</div>
				</div>

				<div class="form-group">
					<label>メールアドレス <span>*</span></label>
					<input type="email"
					       th:field="*{email}"
					       placeholder="example@email.com">

					<p class="field-error"
					   th:if="${#fields.hasErrors('email')}"
					   th:errors="*{email}">
					</p>
				</div>

				<div class="form-group">
					<label>パスワード <span>*</span></label>
					<input type="password"
					       th:field="*{password}"
					       placeholder="••••••••">

					<p class="field-error"
					   th:if="${#fields.hasErrors('password')}"
					   th:errors="*{password}">
					</p>
				</div>

				

				<div class="check-area">
					<label>
						<input type="checkbox">
						<a href="#">利用規約</a>および<a href="#">プライバシーポリシー</a>に同意する
						<span>*</span>
					</label>

					<label>
						<input type="checkbox">
						お知らせメールを受け取る
					</label>
				</div>

				<p class="error-message"
				   th:if="${registerError}"
				   th:text="${registerError}">
				</p>

				<button type="submit" class="register-submit">
					登録する →
				</button>

			</form>

		</section>

	</main>

</body>

</html>
